name: Frontend PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint (ESLint)
        run: npm run lint

      # vitest run — watch 모드 진입 방지 (CI가 타임아웃까지 매달리는 것 차단)
      - name: Unit Test (Vitest)
        run: npm run test:run

      - name: Build Test
        run: npm run build
