name: Nexus Frontend CI/CD (v3.1)
on:
  push: { branches: [main] }
permissions: { id-token: write, contents: read }

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-northeast-2
    - id: ecr
      uses: aws-actions/amazon-ecr-login@v2
    - uses: docker/setup-buildx-action@v3

    - name: Build & Push Frontend
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=https://aivle.p-e.kr
          BACKEND_ORIGIN=http://wms-api-svc:8000
        tags: |
          ${{ steps.ecr.outputs.registry }}/nexus-frontend-repo:${{ github.sha }}
          ${{ steps.ecr.outputs.registry }}/nexus-frontend-repo:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy via SSH (Rolling Update)
      if: ${{ secrets.EC2_HOST != '' }}
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          REG=${{ steps.ecr.outputs.registry }}
          SHA=${{ github.sha }}
          kubectl set image deployment/wms-frontend frontend=$REG/nexus-frontend-repo:$SHA
          kubectl rollout status deployment/wms-frontend --timeout=180s
