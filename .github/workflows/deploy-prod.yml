# 프론트엔드 수동 재배포 전용 워크플로우 (지정 태그로 롤백/재배포).
# 이미지 빌드/푸시는 deploy.yml(main 푸시마다 자동) 또는 ecr-push.yml(수동)이 담당하므로,
# 여기서는 이미 ECR에 존재하는 이미지 태그를 골라 클러스터에 반영하는 역할만 한다.
#
# [2026-08-13] EKS(aws eks update-kubeconfig)는 실제로 쓴 적이 없는 초기 설계 잔재였다 -
# 실제 라이브 클러스터는 EC2 자체 구축 kubeadm이라 deploy.yml과 동일한 SSH 방식으로 교체.
# 종전 파일은 아래가 전부 틀린 채로 main 푸시마다 자동 실행되어 **매번 실패**했다:
#   - 존재하지 않는 EKS 클러스터(wms-prod-cluster) / 네임스페이스(wms-prod)
#   - 존재하지 않는 시크릿(AWS_ACCOUNT_ID) 참조 -> OIDC 역할 ARN이 깨져 첫 스텝에서 중단
#   - 실제와 다른 컨테이너명(wms-frontend-container, 실제는 frontend)
#   - 미치환 플레이스홀더가 든 k8s/*.yml을 apply
# 배포는 deploy.yml이 하고 있었으므로 기능 장애는 아니었으나, 커밋마다 빨간 X가 찍혀
# 진짜 실패를 가리고 있었다. 백엔드 deploy-prod.yml과 동일한 규약으로 맞춘다.
name: Frontend Prod Deploy (Manual Redeploy)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 ECR 이미지 태그 (commit SHA 또는 latest)"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nexus-frontend-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 잡 레벨 env로 시크릿을 옮긴다. GitHub Actions는 스텝 `if:`에서 secrets 컨텍스트를
    # 지원하지 않아, 거기서 직접 참조하면 워크플로 자체가 무효 판정된다.
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSH (Manual Redeploy)
        if: ${{ env.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REG=${{ steps.login-ecr.outputs.registry }}
            TAG=${{ github.event.inputs.image_tag }}
            kubectl set image deployment/wms-frontend frontend=$REG/${{ env.ECR_REPOSITORY }}:$TAG
            kubectl rollout status deployment/wms-frontend --timeout=600s
