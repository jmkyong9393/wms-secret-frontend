name: Cluster Apply Manifests (Frontend)

# k8s/ 매니페스트를 운영 클러스터에 반영한다.
# 기본값은 diff(읽기 전용)다 — 실수로 적용되지 않는다.
#
# 이미지는 절대 이 파일이 정하지 않는다. 자리표시자를 **현재 실행 중인 이미지**로
# 치환한 뒤 적용하므로, 매니페스트 조정이 배포 버전을 되돌리는 일이 없다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diff = 차이만 본다 / apply = 실제 적용"
        type: choice
        options: [diff, apply]
        default: diff
        required: true

permissions: { contents: read }

jobs:
  apply:
    name: Apply k8s manifests
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — EC2_HOST 미설정이면 조용히 끝나지 않게 한다
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST 시크릿이 없습니다. 배포 대상을 찾을 수 없어 중단합니다."
            exit 1
          fi

      - name: Copy manifests to master
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*.yml"
          target: "/tmp/nexus-manifests"
          overwrite: true

      - name: ${{ inputs.mode }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            DIR=/tmp/nexus-manifests/k8s
            MODE="${{ inputs.mode }}"

            # --- 이미지 보존 ---
            # 실행 중인 이미지를 읽어 자리표시자를 치환한다. Deployment가 없으면
            # 되돌릴 기준이 없다는 뜻이므로 진행하지 않는다 (최초 생성은 이 워크플로의 몫이 아니다).
            CURRENT=$(kubectl get deployment wms-frontend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [ -z "$CURRENT" ]; then
              echo "::error::wms-frontend Deployment를 찾을 수 없습니다. 최초 배포는 cluster-rebuild 경로를 쓰십시오."
              exit 1
            fi
            echo "현재 이미지: $CURRENT"
            sed -i "s|REPLACE_WITH_ECR_URI:latest|$CURRENT|" $DIR/deployment.yml
            grep -q "REPLACE_WITH_ECR_URI" $DIR/deployment.yml && { echo "::error::자리표시자 치환 실패"; exit 1; } || true

            # --- probe 순서 함정 방지 ---
            # 매니페스트에 probe가 있는데 그 경로가 **현재 배포본에 없으면** 404가 나고,
            # readiness 실패 → 서비스에서 빠짐 / liveness 실패 → 재시작 루프가 된다.
            # replicas가 1이라 그대로 다운타임이므로, 적용 전에 실물로 확인한다.
            if grep -q "Probe:" $DIR/deployment.yml; then
              PROBE_PATH=$(grep -A3 "Probe:" $DIR/deployment.yml | grep "path:" | head -1 | awk '{print $2}')
              if [ -z "$PROBE_PATH" ]; then
                echo "::error::probe는 있는데 path를 읽지 못했습니다. 매니페스트 구조를 확인하십시오."
                exit 1
              fi
              # NodePort로 현재 서비스 중인 파드에 직접 묻는다.
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:30080${PROBE_PATH}" || echo 000)
              echo "probe 경로 사전 확인: ${PROBE_PATH} → HTTP ${CODE}"
              if [ "$CODE" != "200" ]; then
                echo "::error::현재 배포본에 ${PROBE_PATH} 가 없습니다(HTTP ${CODE})."
                echo "::error::먼저 해당 엔드포인트를 main에 머지해 배포한 뒤 이 워크플로를 실행하십시오."
                echo "::error::지금 적용하면 probe가 전부 실패해 파드가 재시작 루프에 빠집니다."
                exit 1
              fi
            fi

            echo "=== 변경 예정 (kubectl diff) ==="
            # diff는 차이가 있으면 exit 1이다. 그것은 실패가 아니므로 삼킨다.
            kubectl diff -f $DIR/deployment.yml -f $DIR/service.yml || true

            if [ "$MODE" != "apply" ]; then
              echo "diff 모드 — 아무것도 적용하지 않았습니다."
              exit 0
            fi

            echo "=== 적용 ==="
            kubectl apply -f $DIR/deployment.yml -f $DIR/service.yml

            # 롤아웃이 끝나야 '적용됐다'고 말할 수 있다. probe를 새로 넣으면
            # 여기서 준비 실패가 드러난다 — 실패하면 아래 진단이 돈다.
            if ! kubectl rollout status deployment/wms-frontend --timeout=600s; then
              echo "::error::롤아웃 실패 — 아래 진단을 확인하고 필요하면 rollout undo 하십시오."
              kubectl get pods -l app=wms-frontend
              kubectl describe deployment wms-frontend | tail -30
              kubectl get events --sort-by=.lastTimestamp 2>/dev/null | tail -20
              exit 1
            fi

            # --- 검증 ---
            # spec이 아니라 실행 중인 파드를 본다. 이미지가 그대로인지도 함께 확인한다.
            RUNNING=$(kubectl get pods -l app=wms-frontend \
              -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.status.containerStatuses[0].image}{"\n"}{end}' \
              | sort -u | tr '\n' ' ')
            echo "실행 중 이미지: ${RUNNING:-없음}"
            case "$RUNNING" in
              *"$CURRENT"*) echo "검증 통과 — 이미지가 유지된 채 매니페스트만 반영됐습니다." ;;
              *) echo "::error::이미지가 예상과 다릅니다 (기대: $CURRENT)"; exit 1 ;;
            esac

      - name: Cleanup
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: rm -rf /tmp/nexus-manifests
