# 운영 클러스터의 실물 스펙과 일치시킨 매니페스트 (2026-08-25 대조).
# 이미지는 CI(.github/workflows/deploy.yml)가 `kubectl set image`로 교체하므로
# 여기서는 자리표시자를 둔다 — 레지스트리 주소는 공개 레포에 싣지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-frontend
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wms-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: wms-frontend
    spec:
      # AI 워커와 분리된 앱 노드에 고정한다. 없으면 패치할 때마다 배치가 흐트러진다.
      nodeSelector:
        workload-type: app
      # ECR 인증 시크릿. 토큰이 12시간마다 만료되어 cron으로 갱신된다.
      imagePullSecrets:
        - name: ecr-secret
      containers:
        # 컨테이너 이름은 CI의 `set image deployment/wms-frontend frontend=...`가
        # 지정하는 대상이다. 바꾸면 배포가 실패한다.
        - name: frontend
          image: REPLACE_WITH_ECR_URI:latest
          imagePullPolicy: Always
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://nexus-wms.p-e.kr
          ports:
            - containerPort: 3000
          # limits는 두지 않는다(실물 기준). requests만으로 노드 예약을 잡는다.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          # /api/health는 의존성을 확인하지 않는 프로세스 생존 신호다.
          # 적용 전에 그 경로가 실제로 배포돼 있어야 한다 —
          # cluster-apply-manifests 워크플로가 apply 직전에 확인한다.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # replicas가 1이라 오탐 재시작이 곧 다운타임이다. liveness는 readiness보다
          # 느슨하게 잡아, 일시적 지연으로 파드를 죽이지 않는다.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
