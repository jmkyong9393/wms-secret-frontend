apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-frontend
  labels:
    app: wms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wms-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wms-frontend
    spec:
      containers:
      - name: wms-frontend-container
        # Placeholder image, will be overridden by kubectl set image in CI
        image: REPLACE_WITH_ECR_URI:latest 
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
